<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1520" />
    <title>Farfield — Reconnect</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #0a151e;
        color: #d8e6ce;
        font:
          16px ui-monospace,
          monospace;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 100px;
        height: 100px;
      }
      h1 {
        font-size: 26px;
      }
      p {
        color: #a4b7b7;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 16px 28px;
        min-height: 48px;
        background: #c4d8ae;
        color: #10201c;
        text-decoration: none;
        font-weight: bold;
        border-radius: 4px;
      }
      a:focus-visible {
        outline: 3px solid #eaf6d3;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Signal lost</h1>
      <p>Reconnect to the internet to play Farfield.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
