name: Validate Farfield

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run check
      - name: Build and verify repeat builds preserve SDK output isolation
        run: |
          npm run build
          npm run build
      - name: Verify process restart and crash recovery
        run: node tests/server-recovery.mjs
      - name: Verify ranked authentication, settlement and restart cancellation
        run: npm run test:ranked-server
      - name: Verify sustained four-seat event streams
        run: node tests/events-live.mjs
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet
        env:
          GAME_DOMAIN: ci.example.invalid
      - name: Build the production image
        run: docker build --pull --tag farfield:ci .
      - name: Validate split-domain Compose and HTTPS configuration
        run: |
          docker compose --env-file deploy/production.env.example -f deploy/compose.yaml -f deploy/compose.split.yaml config --quiet
          docker run --rm -e GAME_DOMAIN=ci.example.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e GAME_DOMAIN=ci.example.invalid -e API_DOMAIN=api.ci.example.invalid -v "$PWD/deploy/Caddyfile.split:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify nonroot runtime and durable match recovery
        run: node tests/container-smoke.mjs
        env:
          CONTAINER_IMAGE: farfield:ci
      - name: Retain sanitized container test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-smoke
          path: artifacts/container-smoke.json
          if-no-files-found: ignore
          retention-days: 14
